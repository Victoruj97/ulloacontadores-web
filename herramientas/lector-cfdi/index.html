
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Lector CFDI | Ulloa Contadores</title>
  <style>
    :root {
      --azul: #293F56;
      --azul-medio: #667F95;
      --azul-claro: #ABBCC6;
      --fondo: #ECEBE8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--azul);
      font-family: Arial, sans-serif;
    }

    header {
      background: white;
      padding: 18px 6%;
      border-bottom: 1px solid var(--azul-claro);
    }

    header img { width: 180px; max-width: 100%; }

    main {
      max-width: 1050px;
      margin: 55px auto;
      padding: 0 20px;
    }

    h1 { font-size: 32px; margin-bottom: 12px; }

    .intro {
      color: var(--azul-medio);
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .panel {
      background: white;
      border: 1px solid var(--azul-claro);
      border-radius: 14px;
      padding: 35px;
    }

    .carga {
      border: 2px dashed var(--azul-claro);
      border-radius: 12px;
      padding: 45px 20px;
      text-align: center;
      background: #ECEBE8;
    }

    .carga h2 { margin-top: 0; }

    .carga p { color: var(--azul-medio); }

    input[type=file] {
      display: block;
      margin: 25px auto;
      max-width: 100%;
    }

    button {
      border: 0;
      border-radius: 7px;
      background: var(--azul);
      color: white;
      padding: 13px 25px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .estado {
      margin-top: 25px;
      color: var(--azul-medio);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 25px;
      color: var(--azul-medio);
    }

    @media (max-width: 600px) {
      main { margin-top: 30px; }
      h1 { font-size: 26px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>

<header>
  <a href="/">
    <img src="/PNG%20OBSCURO.png" alt="Ulloa Contadores">
  </a>
</header>

<main>
  <h1>Lector CFDI</h1>
  <p class="intro">
    Importa tus comprobantes fiscales digitales
    en formato XML o ZIP para consultar su información
    y generar reportes fiscales.
  </p>

  <section class="panel">
    <div class="carga">
      <h2>Cargar comprobantes</h2>
      <p>Selecciona uno o varios archivos XML o ZIP.</p>

      <input
        id="archivos"
        type="file"
        accept=".xml,.zip"
        multiple
      >

      <button id="procesar" disabled>
        Procesar archivos
      </button>
    </div>

    <div id="estado" class="estado" role="status" aria-live="polite">
      No se han seleccionado archivos.
    </div>
  </section>
</main>

<footer>
  © Ulloa Contadores
</footer>


<script>
const archivos = document.getElementById("archivos");
const procesar = document.getElementById("procesar");
const estado = document.getElementById("estado");

const campos = [
  "UUID", "Tipo", "Fecha", "RFC emisor",
  "Nombre emisor", "RFC receptor",
  "Nombre receptor", "Subtotal",
  "Descuento", "Total", "Moneda",
  "Forma de pago", "Método de pago",
  "IVA trasladado", "IVA retenido",
  "ISR retenido"
];

function hijos(nodo, nombre) {
  return Array.from(nodo?.children || [])
    .filter(x => x.localName === nombre);
}

function hijo(nodo, nombre) {
  return hijos(nodo, nombre)[0] || null;
}

function numero(valor) {
  return Number(valor || 0);
}


function impuestos(nodo, grupo, impuesto) {
  const contenedor = hijo(nodo, "Impuestos");
  const lista = hijo(contenedor, grupo);

  if (!lista) return null;

  const elemento = grupo === "Traslados"
    ? "Traslado" : "Retencion";

  return hijos(lista, elemento)
    .filter(x => x.getAttribute("Impuesto") === impuesto)
    .reduce((suma, x) =>
      suma + numero(x.getAttribute("Importe")), 0);
}

function desgloseIVA(raiz) {
  const resultado = {
    "Base IVA 16%": 0,
    "IVA 16%": 0,
    "Base IVA 8%": 0,
    "IVA 8%": 0,
    "Base IVA 0%": 0,
    "Base exenta": 0
  };

  const conceptos = hijo(raiz, "Conceptos");

  for (const concepto of hijos(conceptos, "Concepto")) {
    const impuestosConcepto = hijo(concepto, "Impuestos");
    const traslados = hijo(impuestosConcepto, "Traslados");

    const registros = hijos(traslados, "Traslado")
      .filter(x => x.getAttribute("Impuesto") === "002");

    for (const traslado of registros) {
      const base = numero(traslado.getAttribute("Base"));
      const importe = numero(traslado.getAttribute("Importe"));
      const tipoFactor = traslado.getAttribute("TipoFactor");
      const tasa = traslado.getAttribute("TasaOCuota");

      if (tipoFactor === "Exento") {
        resultado["Base exenta"] += base;
      } else if (tipoFactor === "Tasa") {
        if (tasa === "0.160000") {
          resultado["Base IVA 16%"] += base;
          resultado["IVA 16%"] += importe;
        } else if (tasa === "0.080000") {
          resultado["Base IVA 8%"] += base;
          resultado["IVA 8%"] += importe;
        } else if (tasa === "0.000000") {
          resultado["Base IVA 0%"] += base;
        }
      }
    }
  }

  return resultado;
}

function leerCFDI(xml, nombreArchivo) {
  const documento = new DOMParser()
    .parseFromString(xml, "application/xml");

  if (documento.querySelector("parsererror")) {
    throw new Error("XML inválido");
  }

  const raiz = documento.documentElement;

  if (raiz.localName !== "Comprobante" ||
      raiz.namespaceURI !==
      "http://www.sat.gob.mx/cfd/4") {
    throw new Error("No es un CFDI 4.0");
  }

  const emisor = hijo(raiz, "Emisor");
  const receptor = hijo(raiz, "Receptor");
  const complemento = hijo(raiz, "Complemento");

  const timbre = Array.from(
    complemento?.children || []
  ).find(x => x.localName === "TimbreFiscalDigital");

  const tipo = raiz.getAttribute("TipoDeComprobante") || "";
  const factor = tipo === "E" ? -1 : 1;

  const desglose = desgloseIVA(raiz);

  const ivaTrasladado = impuestos(
    raiz, "Traslados", "002"
  );

  const ivaRetenido = impuestos(
    raiz, "Retenciones", "002"
  );

  const isrRetenido = impuestos(
    raiz, "Retenciones", "001"
  );

  const resultado = {
    "UUID": timbre?.getAttribute("UUID") || "",
    "Tipo": tipo,
    "Fecha": raiz.getAttribute("Fecha") || "",
    "RFC emisor": emisor?.getAttribute("Rfc") || "",
    "Nombre emisor": emisor?.getAttribute("Nombre") || "",
    "RFC receptor": receptor?.getAttribute("Rfc") || "",
    "Nombre receptor": receptor?.getAttribute("Nombre") || "",
    "Subtotal": numero(raiz.getAttribute("SubTotal")) * factor,
    "Descuento": numero(raiz.getAttribute("Descuento")) * factor,
    "Total": numero(raiz.getAttribute("Total")) * factor,
    "Moneda": raiz.getAttribute("Moneda") || "",
    "Forma de pago": raiz.getAttribute("FormaPago") || "",
    "Método de pago": raiz.getAttribute("MetodoPago") || "",
    "IVA trasladado": ivaTrasladado === null
      ? null : ivaTrasladado * factor,
    "IVA retenido": ivaRetenido === null
      ? null : ivaRetenido * factor,
    "ISR retenido": isrRetenido === null
      ? null : isrRetenido * factor
  };

  for (const [campo, importe] of Object.entries(desglose)) {
    resultado[campo] = importe * factor;
  }

  return resultado;
}

archivos.addEventListener("change", () => {
  const total = archivos.files.length;
  procesar.disabled = total === 0;

  estado.textContent = total
    ? `${total} archivo(s) seleccionado(s).`
    : "No se han seleccionado archivos.";
});

procesar.addEventListener("click", async () => {
  const resultados = [];
  const errores = [];

  procesar.disabled = true;
  estado.textContent = "Procesando archivos...";

  for (const archivo of archivos.files) {
    try {
      if (!archivo.name.toLowerCase().endsWith(".xml")) {
        throw new Error(
          "Los ZIP se habilitarán en otra etapa"
        );
      }

      const contenido = await archivo.text();

      resultados.push(
        leerCFDI(contenido, archivo.name)
      );

    } catch (error) {
      errores.push(`${archivo.name}: ${error.message}`);
    }
  }

  estado.replaceChildren();

  const resumen = document.createElement("p");
  resumen.textContent =
    `${resultados.length} CFDI procesados. ` +
    `${errores.length} archivos con observaciones.`;
  estado.appendChild(resumen);

  if (resultados.length) {
    const contenedor = document.createElement("div");
    contenedor.style.overflowX = "auto";

    const tabla = document.createElement("table");
    tabla.style.borderCollapse = "collapse";
    tabla.style.width = "100%";

    const encabezado = document.createElement("tr");

    campos.forEach(campo => {
      const th = document.createElement("th");
      th.textContent = campo;
      th.style.padding = "12px";
      th.style.background = "#293F56";
      th.style.color = "white";
      encabezado.appendChild(th);
    });

    tabla.appendChild(encabezado);

    resultados.forEach((resultado, indice) => {
      const fila = document.createElement("tr");

      campos.forEach(campo => {
        const celda = document.createElement("td");
        const valor = resultado[campo];

        celda.textContent = valor === null
          ? "Sin desglose"
          : String(valor);

        celda.style.padding = "10px";
        celda.style.borderBottom = "1px solid #ABBCC6";

        fila.appendChild(celda);
      });

      tabla.appendChild(fila);
    });

    contenedor.appendChild(tabla);
    estado.appendChild(contenedor);
  }

  if (errores.length) {
    const titulo = document.createElement("p");
    titulo.textContent = "Observaciones:";
    estado.appendChild(titulo);

    errores.forEach(error => {
      const linea = document.createElement("p");
      linea.textContent = error;
      estado.appendChild(linea);
    });
  }

  procesar.disabled = false;
});
</script>


</body>
</html>
